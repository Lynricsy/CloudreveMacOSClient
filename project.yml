name: Cloudreve
options:
  bundleIdPrefix: plus.ling
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  CloudreveKit:
    path: Packages/CloudreveKit
targets:
  Cloudreve:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: CloudreveKit
        product: CloudreveSync
      - package: CloudreveKit
        product: CloudreveAPI
      - target: CloudreveFileProvider
        embed: true
        codeSign: true
    entitlements:
      path: App/Cloudreve.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.plus.ling.cloudreve
        keychain-access-groups:
          - $(AppIdentifierPrefix)plus.ling.cloudreve.shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cloudreve
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        CFBundleURLTypes:
          - CFBundleURLName: plus.ling.cloudreve.oauth
            CFBundleURLSchemes:
              - cloudreve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plus.ling.cloudreve
        PRODUCT_NAME: Cloudreve
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  CloudreveFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - FileProviderExtension
      - Shared
    dependencies:
      - package: CloudreveKit
        product: CloudreveSync
      - package: CloudreveKit
        product: CloudreveAPI
    entitlements:
      path: FileProviderExtension/CloudreveFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.plus.ling.cloudreve
        keychain-access-groups:
          - $(AppIdentifierPrefix)plus.ling.cloudreve.shared
    info:
      path: FileProviderExtension/Info.plist
      properties:
        CFBundleDisplayName: Cloudreve File Provider
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: cloud
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: group.plus.ling.cloudreve
          NSExtensionFileProviderSupportsFailingUploadOnConflict: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: plus.ling.cloudreve.fileprovider
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
schemes:
  Cloudreve:
    build:
      targets:
        Cloudreve: all
        CloudreveFileProvider: all
    run:
      config: Debug
    archive:
      config: Release
