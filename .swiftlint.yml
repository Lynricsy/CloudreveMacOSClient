included:
  - Packages
  - App
  - FileProviderExtension
  - Shared
excluded:
  - Packages/CloudreveKit/.build
disabled_rules:
  - todo
  # 有意使用 String(decoding:as:) 容错解码响应体
  - optional_data_string_conversion
opt_in_rules:
  - explicit_init
  - closure_spacing
  - unneeded_parentheses_in_closure_argument
line_length:
  warning: 140
  error: 180
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 600
  error: 900
identifier_name:
  min_length: 2
# 计划中的同步引擎/上传接口参数较多（如 SyncEngine.modify 9 个参数）
function_parameter_count:
  warning: 10
  error: 12
# 错误码映射等一一对应的 switch 不计入圈复杂度
cyclomatic_complexity:
  ignores_case_statements: true
