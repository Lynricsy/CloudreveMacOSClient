name: Release

# 推送 vX.Y.Z tag 时发布：先跑完整 CI，再编译 arm64 Release 配置，最后创建只含说明的 GitHub Release
# （源码归档由 GitHub 自动附带）。没有 Developer ID 签名，未签名构建只作为 Actions artifact 保留供检查，不挂到 Release。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: 构建并发布
    needs: ci
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 校验 tag 与版本号一致
        run: |
          version=$(sed -n 's/^MARKETING_VERSION = //p' Config/Base.xcconfig)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG 与 Config/Base.xcconfig 的 MARKETING_VERSION $version 不一致"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: 提取版本说明
        run: |
          # 取 CHANGELOG.md 中 "## [版本]" 到下一个 "## [" 之间的内容
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md 中没有 [$VERSION] 的说明"
            exit 1
          fi

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 构建 Release（arm64，不签名）
        run: |
          xcodegen generate
          xcodebuild -project Cloudreve.xcodeproj -scheme Cloudreve -configuration Release \
            -derivedDataPath DerivedData ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: 打包
        run: |
          app=DerivedData/Build/Products/Release/Cloudreve.app
          lipo -archs "$app/Contents/MacOS/Cloudreve" | grep -qx arm64
          asset="Cloudreve-$VERSION-arm64-unsigned.zip"
          ditto -c -k --keepParent "$app" "$asset"
          shasum -a 256 "$asset" >"$asset.sha256"
          echo "ASSET=$asset" >>"$GITHUB_ENV"

      - name: 保留未签名构建（仅 Actions artifact）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

      - name: 创建 Release
        run: gh release create "$TAG" --verify-tag --title "Cloudreve $TAG" --notes-file notes.md
