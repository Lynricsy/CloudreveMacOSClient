name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  test:
    name: 测试与构建
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 XcodeGen 与 SwiftLint
        run: brew install xcodegen swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --quiet

      - name: CloudreveKit 单元测试
        working-directory: Packages/CloudreveKit
        run: swift test

      - name: 构建 App 与扩展（arm64，不签名）
        run: |
          xcodegen generate
          xcodebuild -project Cloudreve.xcodeproj -scheme Cloudreve -configuration Debug \
            -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
